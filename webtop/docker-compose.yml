# Full Ubuntu + Xfce desktop in the browser (linuxserver/webtop).
# Served over Selkies on host port 3005 → container 3000.
services:
  webtop:
    image: lscr.io/linuxserver/webtop:ubuntu-xfce
    container_name: webtop
    security_opt:
      - seccomp:unconfined
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Toronto
      - SUBFOLDER=/
      - TITLE=Dev Environment
    volumes:
      - webtop-config:/config
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "3005:3000"
    shm_size: "2gb"
    restart: unless-stopped

volumes:
  webtop-config:

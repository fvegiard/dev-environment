    --accent: #7c5cff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(1200px 800px at 50% -10%, #1a1f2e 0%, var(--bg) 55%);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 18px; border-bottom: 1px solid var(--border);
    background: rgba(18,22,31,0.85); backdrop-filter: blur(8px);
    z-index: 10;
  }
  header .logo {
    width: 34px; height: 34px; border-radius: 9px;
    background: linear-gradient(135deg, #7c5cff, #4cc9f0);
    display: grid; place-items: center; font-weight: 800; font-size: 18px; color: #fff;
  }
  header h1 { font-size: 16px; font-weight: 700; letter-spacing: .3px; }
  header .sub { font-size: 12px; color: var(--muted); }
  header .spacer { flex: 1; }
  #search {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 7px 12px; font-size: 13px; width: 240px; outline: none;
  }
  #search:focus { border-color: var(--accent); }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; padding: 8px 18px; border-bottom: 1px solid var(--border); background: rgba(18,22,31,.6); }
  .legend .item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
  .legend .dot { width: 10px; height: 10px; border-radius: 50%; }
  #stage { flex: 1; position: relative; cursor: grab; }
  #stage:active { cursor: grabbing; }
  svg { width: 100%; height: 100%; display: block; }
  .node { cursor: pointer; }
  .node circle { stroke: rgba(0,0,0,.35); stroke-width: 1; transition: r .15s ease; }
  .node text { font-size: 11px; fill: var(--text); pointer-events: none; text-anchor: middle; }
  .node .sub { font-size: 9px; fill: var(--muted); }
  .link { stroke: #2a3346; stroke-opacity: .55; }
  .node.dim { opacity: .12; }
  .node.hit circle { stroke: #fff; stroke-width: 2.5; }
  #detail {
    position: absolute; right: 16px; top: 16px; width: 300px; max-height: calc(100% - 32px);
    background: rgba(18,22,31,.96); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px; overflow-y: auto; display: none; box-shadow: 0 12px 40px rgba(0,0,0,.5);
  }
  #detail h2 { font-size: 15px; margin-bottom: 4px; }
  #detail .cat { font-size: 11px; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
  #detail p { font-size: 12.5px; color: var(--muted); line-height: 1.55; }
  #detail .close { position: absolute; top: 10px; right: 12px; background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; }
  .hint { position: absolute; left: 16px; bottom: 14px; font-size: 11px; color: var(--muted); pointer-events: none; }
</style>
</head>

  e.setAttribute("class","link"); g.appendChild(e); return e;
});
const nodeEls = nodes.map(n => {
  const grp = document.createElementNS("http://www.w3.org/2000/svg","g");
  grp.setAttribute("class","node");
  const c = document.createElementNS("http://www.w3.org/2000/svg","circle");
  c.setAttribute("fill", CATS[n.cat].color);
  const t = document.createElementNS("http://www.w3.org/2000/svg","text");
  t.setAttribute("dy","-6"); t.textContent = n.label;
  const s = document.createElementNS("http://www.w3.org/2000/svg","text");
  s.setAttribute("class","sub"); s.setAttribute("dy","10"); s.textContent = n.sub || "";
  grp.appendChild(c); grp.appendChild(t); grp.appendChild(s);
  grp.addEventListener("click", e => { e.stopPropagation(); showDetail(n); });
  grp.addEventListener("mousedown", e => { e.stopPropagation(); dragNode(n, e); });
  g.appendChild(grp);
  return { grp, c, t, s, n };
});

// force simulation
function tick() {
  const cx = W()/2, cy = H()/2;
  // center pull
  byId["mavis"].vx += (cx - byId["mavis"].x)*0.02;
  byId["mavis"].vy += (cy - byId["mavis"].y)*0.02;
  // repulsion
  for (let i=0;i<nodes.length;i++) for (let j=i+1;j<nodes.length;j++) {
    const a=nodes[i], b=nodes[j];
    let dx=a.x-b.x, dy=a.y-b.y, d2=dx*dx+dy*dy+0.01, d=Math.sqrt(d2);
    const f = 900/d2;
    a.vx += dx/d*f; a.vy += dy/d*f; b.vx -= dx/d*f; b.vy -= dy/d*f;
  }
  // springs
  for (const l of links) {
    const a=l.source, b=l.target;
    const dx=b.x-a.x, dy=b.y-a.y, d=Math.sqrt(dx*dx+dy*dy)||1;
    const f=(d-90)*0.02;
    a.vx += dx/d*f; a.vy += dy/d*f; b.vx -= dx/d*f; b.vy -= dy/d*f;
  }
  for (const n of nodes) {
    if (n.dragging) continue;
    n.vx *= 0.85; n.vy *= 0.85;
    n.x += n.vx; n.y += n.vy;
    n.x = Math.max(40, Math.min(W()-40, n.x));
    n.y = Math.max(40, Math.min(H()-40, n.y));
  }
  render();
}

function render() {
  linkEls.forEach((e,i) => {
    const l = links[i];
    e.setAttribute("x1", l.source.x); e.setAttribute("y1", l.source.y);
    e.setAttribute("x2", l.target.x); e.setAttribute("y2", l.target.y);
  });
  nodeEls.forEach(({grp,c,t,s,n}) => {
    grp.setAttribute("transform", `translate(${n.x},${n.y})`);
    c.setAttribute("r", n.r);
    t.setAttribute("y", -n.r-4);
    s.setAttribute("y", n.r+12);
  });
}

// pan/zoom
let tx=0, ty=0, scale=1;
function applyTransform() {
  g.setAttribute("transform", `translate(${tx},${ty}) scale(${scale})`);
}
stage.addEventListener("wheel", e => {
  e.preventDefault();
  const f = e.deltaY < 0 ? 1.1 : 0.9;
  scale = Math.max(0.3, Math.min(3, scale*f));
  applyTransform();
}, { passive:false });

let panning=false, px=0, py=0;
stage.addEventListener("mousedown", e => { panning=true; px=e.clientX; py=e.clientY; });
window.addEventListener("mousemove", e => {
  if (!panning) return;
  tx += e.clientX-px; ty += e.clientY-py; px=e.clientX; py=e.clientY;
  applyTransform();
});
window.addEventListener("mouseup", () => { panning=false; });

function dragNode(n, e) {
  n.dragging = true;
  const move = ev => {
    const rect = svg.getBoundingClientRect();
    n.x = (ev.clientX-rect.left-tx)/scale;
    n.y = (ev.clientY-rect.top-ty)/scale;
    render();
  };
  const up = () => { n.dragging=false; window.removeEventListener("mousemove", move); window.removeEventListener("mouseup", up); };
  window.addEventListener("mousemove", move);
  window.addEventListener("mouseup", up);
}

// detail panel
function showDetail(n) {
  document.getElementById("d-title").textContent = n.label;
  document.getElementById("d-cat").textContent = CATS[n.cat].label;
  document.getElementById("d-body").textContent = n.body || "";
  document.getElementById("detail").style.display = "block";
}
function closeDetail() { document.getElementById("detail").style.display = "none"; }

// search
document.getElementById("search").addEventListener("input", e => {
  const q = e.target.value.toLowerCase();
  nodeEls.forEach(({grp,n}) => {
    const hit = !q || n.label.toLowerCase().includes(q) || (n.sub||"").toLowerCase().includes(q);
    grp.classList.toggle("dim", !hit);
    grp.classList.toggle("hit", q && hit);
  });
});

// run
setInterval(tick, 16);
window.addEventListener("resize", render);
</script>
</body>
</html>
